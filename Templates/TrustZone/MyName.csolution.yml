solution:
# A solution is a collection of related projects that share the same base configuration

  created-for: CMSIS-Toolbox@2.14.0
  cdefault:                     # use settings from cdefault.yml
  compiler: AC6                 # select the compiler for this solution

# List the packs that define the device and/or board, optional with minimum version
  packs:
    - pack: MyVendor::MyDevice_DFP        # replace with matching device family pack (DFP) for the device
#   - pack: MyVendor::MyBoard_BSP@^1.2.0  # add a board support pack (BSP) when using a board
    - pack: ARM::CMSIS@^6.1.0             # pack shared by all projects in this solution

# List different hardware targets that are used to deploy the solution
  target-types:
    - type: MyTargetName        # choose a brief name for your target hardware
      device: MyDeviceName      # replace with your device or comment out to use a board
#     board: MyBoardName        # optionally specify your board (the board selects the device)
      target-set:               # group the secure and non-secure application images
        - set: Debug
          images:
            - project-context: MyNameS.Debug    # secure image
            - project-context: MyNameNS.Debug   # non-secure image
        - set: Release
          images:
            - project-context: MyNameS.Release  # secure image
            - project-context: MyNameNS.Release # non-secure image

# List different build types
  build-types:
    - type: Debug
      debug: on
      optimize: debug

    - type: Release
      debug: off
      optimize: balanced

# List related projects
  projects:
    - project: Secure/MyNameS.cproject.yml     # generates the CMSE library used by the non-secure project
    - project: NonSecure/MyNameNS.cproject.yml # consumes the secure project's CMSE library
