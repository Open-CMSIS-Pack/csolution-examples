project:
# A project translates into one executable or library
  processor:
    trustzone: secure          # This project is executed in secure mode

# List packs required only by this project; shared packs are specified in the solution
# packs:
#   - pack: MyVendor::MySecurePack

  groups:
    - group: Source Files
#     files: 
#       - file: main.c
#       - file: MyFile1.c

#   - group: MyGroup
#     files: 
#       - file: MyFile2.cpp

# A software component is a reusable unit that may be configurable
  components:                  # List components to use for your application
    - component: CMSIS:CORE    # The CMSIS-Core component used in most projects
#   - component: Device:Startup&Baremetal
#   - component: Cclass:Cgroup:Csub&Cvariant

# Generate an ELF file for symbols, a HEX file for loading, and a linker map file
  output:
    type:
      - elf
      - hex
      - map
