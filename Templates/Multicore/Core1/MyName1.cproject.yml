project:
# A project translates into one executable or library

# Select a processor of the device specified by the solution target
  device: :MyCore1             # replace MyCore1 with the processor Pname; ':' inherits the device

# List packs required only by this core; shared packs are specified in the solution
# packs:
#   - pack: MyVendor::MyCorePack

  groups:
    - group: Source Files
#     files: 
#       - file: main_core1.c
#       - file: MyFile1.c

#   - group: MyGroup
#     files: 
#       - file: MyFile2.cpp

# A software component is a reusable unit that may be configurable
  components:                  # List components to use for your application
    - component: CMSIS:CORE    # The CMSIS-Core component used in most projects
#   - component: Device:Startup
#   - component: Cclass:Cgroup:Csub&Cvariant

# Generate an ELF file for symbols, a HEX file for loading, and a linker map file
  output:
    type:
      - elf
      - hex
      - map
