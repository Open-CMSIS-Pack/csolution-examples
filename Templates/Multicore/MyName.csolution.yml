solution:
# A solution is a collection of related projects that share the same base configuration

  created-for: CMSIS-Toolbox@2.14.0
  cdefault:                 # use settings from cdefault.yml
  compiler: AC6             # select the compiler for this solution

# List the packs that define the device and/or board
  packs:
    - pack: MyVendor::MyDevice_DFP    # replace with matching device family pack (DFP) for the device
#   - pack: MyVendor::MyBoard_BSP     # add a board support pack (BSP) when using a board
    - pack: ARM::CMSIS@^6.1.0         # pack shared by all projects in this solution

# List different hardware targets that are used to deploy the solution
  target-types:
    - type: MyTargetName    # choose a brief name for your target hardware
      device: MyDeviceName  # replace with your device or comment out to use a board
#     board: MyBoardName    # optionally specify your board (the board selects the device)
      target-set:           # group the project outputs into application images
        - set: Debug
          images:
            - project-context: MyName0.Debug    # image built from Core0/MyName0.cproject.yml
            - project-context: MyName1.Debug    # image built from Core1/MyName1.cproject.yml
        - set: Release
          images:
            - project-context: MyName0.Release  # image built from Core0/MyName0.cproject.yml
            - project-context: MyName1.Release  # image built from Core1/MyName1.cproject.yml

# List different build types
  build-types:
    - type: Debug
      debug: on
      optimize: debug
      misc:
        - for-compiler: AC6
          C:
            - -funwind-tables  # ensure reliable stack unwinding with GDB

    - type: Release
      debug: off
      optimize: balanced

# List related projects
  projects:
    - project: Core0/MyName0.cproject.yml    # project running on Core0
    - project: Core1/MyName1.cproject.yml    # project running on Core1
