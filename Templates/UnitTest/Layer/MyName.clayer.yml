layer:
# This reusable layer contains source files and components shared by the test projects

# List packs required by this reusable layer
  packs:
    - pack: ARM::CMSIS@^6.1.0  # provides the CMSIS:CORE component used by this layer
#   - pack: MyVendor::MyHALPack

  groups:
    - group: Source Files
#     files: 
#       - file: main.c
#       - file: MyFile1.c

#   - group: MyGroup
#     files: 
#       - file: MyFile2.cpp

# A software component is a reusable unit that may be configurable
  components:                  # List components provided by the layer
    - component: CMSIS:CORE    # The CMSIS-Core component used in most projects
#   - component: Device:Startup&Baremetal
#   - component: Cclass:Cgroup:Csub&Cvariant
