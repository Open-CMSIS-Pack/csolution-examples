project:
# A test project translates into an independent test executable

# List packs required only by this test project; layer packs are specified in the layer
# packs:
#   - pack: MyVendor::MyTestPack

  groups:
    - group: Source Files
      # Add at least one source file
#     files: 
#       - file: main.c
#       - file: MyFile1.c

#   - group: MyGroup
#     files: 
#       - file: MyFile2.cpp

# List components required only by this test project; shared components are in the layer
# components:
#   - component: Cclass:Cgroup:Csub&Cvariant

# Import the reusable layer containing support shared by the test projects
  layers:
    - layer: ../Layer/MyName.clayer.yml

# Generate an ELF file for symbols, a HEX file for loading, and a linker map file
  output:
    type:
      - elf
      - hex
      - map
