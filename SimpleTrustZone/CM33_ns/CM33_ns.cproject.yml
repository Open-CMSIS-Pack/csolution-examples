project:
  processor:
    trustzone: non-secure

  add-path:
    - ../CM33_s

  groups:
    - group: Non-secure Code
      files:
        - file: main_ns.c
    - group: CMSE Library
      files:
        - file: $cmse-lib(CM33_s)$
          for-context: +AVH
        - file: ../out/CM33_s/AVH/$BuildType$/CM33_s_CMSE_Lib.o
          for-context: +AVH-NS-only

  components:
    - component: CMSIS:CORE
    - component: Device:Startup&C Startup
