solution:
  created-for: CMSIS-Toolbox@2.12.0
  cdefault:
  select-compiler:
    - compiler: AC6
    - compiler: GCC

  compiler: AC6
  
  packs:
    - pack: ARM::CMSIS
    - pack: ARM::Cortex_DFP
    - pack: ARM::CMSIS-View

  target-types:
    - type: AVH
      device: ARM::ARMCM33
      target-set:
        - set:
          images:
            - project-context: CM33_ns.Debug
            - project-context: CM33_s.Debug
          debugger:
            name: Arm-FVP
            model: FVP_MPS2_Cortex-M33
            config-file: ../FVP/FVP_MPS2_Cortex-M33/fvp_config.txt
            args: --stat

  build-types:
    - type: Debug
      debug: on
      optimize: debug
    - type: Release
      debug: off
      optimize: balanced

  projects:
    - project: ./CM33_ns/CM33_ns.cproject.yml
    - project: ./CM33_s/CM33_s.cproject.yml
