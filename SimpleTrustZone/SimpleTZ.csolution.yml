solution:
  created-for: CMSIS-Toolbox@2.14.0
  cdefault:
  select-compiler:
    - compiler: AC6
    - compiler: GCC

  compiler: AC6

  packs:
    - pack: ARM::CMSIS
    - pack: ARM::CMSIS-Compiler
    - pack: ARM::Cortex_DFP
    - pack: ARM::CMSIS-View

  target-types:
    - type: AVH
      device: ARM::ARMCM33
      target-set:
        - set: Debug
          images:
            - project-context: CM33_ns.Debug
            - project-context: CM33_s.Debug
          debugger:
            name: Arm-FVP
            model: FVP_MPS2_Cortex-M33
            config-file: ../FVP/FVP_MPS2_Cortex-M33/fvp_config.txt
            args: --simlimit 10 --stat
        - set: Release
          images:
            - project-context: CM33_ns.Release
            - project-context: CM33_s.Release
          debugger:
            name: Arm-FVP
            model: FVP_MPS2_Cortex-M33
            config-file: ../FVP/FVP_MPS2_Cortex-M33/fvp_config.txt
            args: --simlimit 10 --stat

    - type: AVH-NS-only
      device: ARM::ARMCM33
      target-set:
        - set: Debug
          images:
            - image: out/CM33_s/AVH/Debug/CM33_s.hex
              load: image
            - project-context: CM33_ns.Debug
          debugger:
            name: Arm-FVP
            model: FVP_MPS2_Cortex-M33
            config-file: ../FVP/FVP_MPS2_Cortex-M33/fvp_config.txt
            args: --simlimit 10 --stat
        - set: Release
          images:
            - image: out/CM33_s/AVH/Release/CM33_s.hex
              load: image
            - project-context: CM33_ns.Release
          debugger:
            name: Arm-FVP
            model: FVP_MPS2_Cortex-M33
            config-file: ../FVP/FVP_MPS2_Cortex-M33/fvp_config.txt
            args: --simlimit 10 --stat

  build-types:
    - type: Debug # toolchain options for 'debug'
      debug: on
      optimize: debug
      misc:
        - for-compiler: AC6
          C:
            - -funwind-tables # ensure reliable stack unwinding with GDB
    - type: Release # toolchain options for 'release'
      debug: off
      optimize: balanced

  projects:
    - project: ./CM33_ns/CM33_ns.cproject.yml
    - project: ./CM33_s/CM33_s.cproject.yml
